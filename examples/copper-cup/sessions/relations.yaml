npc-raymond:
  pc-001:
    关系:
    - 角色: 挚友与知情者
      起: E0001
    来历:
    - 事: 两人相识多年，雷蒙德知道塔莉娅的红铜龙身份并为她守密，游历途中常回铜杯旅店歇脚。
      出处: E0001
    生效: true
npc-hubert:
  pc-001:
    关系:
    - 角色: 旅店管事与老伙计
      起: E0001
    来历:
    - 事: 曾是雷蒙德家的老仆人，受雇替塔莉娅管采购、账目与排班；不知道她是龙，只隐约觉得老板有些地方不太对劲。
      出处: E0001
    生效: true
