# 性格骰表（engine/persona.py）：没写底卡性格的人，登记时每栏骰一项（在乎、触点各两项，不重样），记进 sessions/persona.yaml。
# 用来打破主持顺手的那几样（话少、眼尖、六十来岁……），也给他一面还没露过的、让塔莉娅慢慢摸清的东西。
# 只写性子、在乎什么、怎么想事；不写原话、口头禅、固定小动作和“常、多半”这类频率词（E1541：会变成台词库）。
# 改表不影响已经骰过的人（骰出来的字记在 sessions/persona.yaml 里）。

待人:   # 谁都看得到的：头几回见面他怎么待人
  - 热络，见面就拉家常
  - 客气周到，可总隔着一层
  - 直来直去，不怕得罪人
  - 爱挑刺，先说毛病再说好
  - 慢热，头几回冷淡，熟了话才多
  - 爱打听，什么事都要问个来龙去脉
  - 好面子，人前要撑场面
  - 殷勤，招呼得人不好意思
  - 心思常不在眼前，答话慢半拍
  - 爱讲道理，凡事要论个对错
  - 一本正经，开不得玩笑
  - 爱说笑，正经事也先逗两句
  - 拘谨，怕说错话，先看人脸色
  - 豪爽，请客出钱不眨眼
  - 好为人师，爱指点别人
  - 谨慎，话说三分，先看对方来路
  - 冷淡，办完事就送客
  - 絮叨，一件事翻来覆去说
  - 爱抱怨，嘴上没一样顺心的
  - 和气，笑眯眯的，看不出心里想什么

在乎:   # 骰两样；两样打架的地方就是这个人的矛盾
  - 公道：该谁的就是谁的
  - 体面：不能叫人看笑话
  - 安稳：日子别出岔子
  - 手艺：活要做得地道
  - 家里人：爹娘儿女兄弟排第一
  - 自在：不受人管
  - 钱：攒在手里才踏实
  - 名声：街坊怎么说他
  - 弄明白：没想通的事放不下
  - 信义：答应了就办到
  - 规矩：老规矩不能乱
  - 痛快：今天过得高兴最要紧
  - 不欠人：人情钱债都要清
  - 信仰：神看着呢
  - 争气：什么都要争口气
  - 护着弱的：看不得人受欺负
  - 新鲜：没见过的都想试试
  - 和气：别伤了和气
  - 出头：不想一辈子待在这个位置
  - 故土：这地方的人和老事

毛病:   # 真会给人添麻烦的，不是讨喜的那种
  - 记仇，旧账一笔笔记着
  - 嫉妒，见不得身边人比自己好
  - 死要面子，错了也不认
  - 胆小，事到临头先往后缩
  - 贪小便宜
  - 嘴不严，藏不住别人的事
  - 固执，认定了就拉不回来
  - 疑心重，好意也要先掂量
  - 有个戒不掉的瘾（酒、赌、烟叶之类）
  - 顺口就撒小谎
  - 脾气上来不管不顾
  - 看人分高低，对穷人和外乡人另一副脸
  - 拖，答应的事一拖再拖
  - 爱管闲事，什么都要插一手
  - 不会拒绝，揽下的事办不完
  - 自怜，觉得旁人都亏欠他
  - 轻信，谁的话都当真
  - 小气，舍不得花钱也舍不得给
  - 爱比，总拿自己和别人比
  - 躲事，难事一来就装没看见

怕:
  - 老了没人管
  - 被人看不起
  - 再穷回去
  - 身边的人出事
  - 被人骗
  - 一个人孤零零的
  - 旧事被翻出来
  - 辜负了谁的托付
  - 病和死
  - 变——搬家、换活、换地方
  - 欠下还不上的债
  - 自己其实没本事
  - 官府、刀兵这类惹不起的
  - 一样具体的东西（水、火、黑、高处），有来由
  - 让家里人失望
  - 被人丢下
  - 说错话得罪人
  - 魔法和说不清的东西
  - 神怪罪
  - 一辈子就这样过去

自己的事:   # 跟塔莉娅无关、了结之前一直成立的牵挂、麻烦、打算（写成底卡时不写日子，E2108）
  - 在攒钱，想买下一样东西（铺子、地、牲口）
  - 欠着一笔债，正想法子还
  - 跟家里一个人闹僵了，好久不说话
  - 惦着一个走了的人（死了或远走）
  - 在偷偷学一样跟本行不相干的本事
  - 家里有人病着，钱和心思都耗在那儿
  - 跟同行或邻居较着劲
  - 想离开这里，还没下定决心
  - 替别人守着一个秘密
  - 感情上有件拿不定主意的事
  - 手上的营生在走下坡
  - 在带徒弟或拉扯一个孩子，操心得很
  - 在找一个失散的人或一样丢了的东西
  - 身上有旧伤旧病，瞒着不说
  - 刚栽了个跟头，还没缓过来
  - 跟官府、行会或东家扯着一桩皮
  - 许过一个愿，还没还
  - 年轻时做过一件后悔的事，想补回来
  - 有个不争气的亲戚，老来找他要钱
  - 在筹划一件大事（开铺、出远门、成家），八字还没一撇

爱好:   # 一样本事或爱好
  - 认得星象，夜里看天辨方向
  - 会一样乐器（笛、手鼓、乌德琴之类）
  - 记性极好，账目人名过耳不忘
  - 下棋或玩骰戏是一把好手
  - 养着一样活物（鸟、猫、狗、羊），当宝贝
  - 爱听故事、讲故事
  - 会几句外族话（精灵语、矮人语之类）
  - 会做一样拿手吃食
  - 认得草药，治得了小病
  - 手巧，会修修补补
  - 爱侍弄花草菜园
  - 写得一手好字，或者会画
  - 会唱，有几支拿手的老歌
  - 爱收一样小东西（钱币、石头、贝壳、旧书）
  - 认得路，走过很多地方
  - 力气或手上功夫过人
  - 会算命、看手相，信不信由人
  - 爱钓鱼、打猎或摆弄牲口
  - 懂行情，一眼看出货的好坏
  - 会讲笑话，能把一屋子人逗乐
  - 年轻时当过兵或吃过佣兵饭，刀上功夫没撂下（真打起来比身份看着强一档）

触点:   # 骰两样：碰上这种场合，熟了才知道的那一面才露出来
  - 有人当面驳他
  - 谈到钱
  - 见到孩子或弱的吃亏
  - 发现有人撒谎
  - 被人夸
  - 喝了酒
  - 有人提起他家里人
  - 累狠了或病了
  - 有人求他办事
  - 受了别人的恩
  - 看见东西被糟蹋
  - 被人催
  - 被人看轻
  - 碰上同行
  - 有人说话不算数
  - 遇上危险
  - 夜里一个人的时候
  - 有人要走
  - 碰上没见过的新东西
  - 被问起从前
