$schema: https://json-schema.org/draft/2020-12/schema
type: object
additionalProperties:
  type: object
  additionalProperties: false
  required: [from, to, mode, source]
  oneOf: [{required: [segments]}, {required: [map]}]
  properties:
    from: {type: string, pattern: '^loc-'}
    to: {type: string, pattern: '^loc-'}
    mode: {enum: [徒步, 骑乘, 驴车, 乘船]}
    source: {type: string, minLength: 1}
    timing: {enum: [elapsed]}
    caravan: {enum: [horse, camel, mule, donkey]}
    map: {type: array, minItems: 3, maxItems: 3, items: {type: string}}
    routine:
      type: object
      additionalProperties: false
      required: [rest_start, rest_hours, rest_as, food, source]
      properties:
        travel_start: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'}
        rest_start: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'}
        rest_hours: {type: integer, minimum: 1, maximum: 12}
        rest_as: {enum: [出神, 睡]}
        food: {enum: [自备, 供餐]}
        source: {type: string, minLength: 1}
    segments:
      type: array
      minItems: 1
      items:
        type: object
        additionalProperties: false
        required: [at]
        allOf:
          - if: {required: [distance_miles]}
            then: {required: [road, cart_allowed]}
          - if: {anyOf: [{required: [checkpoint]}, {required: [pause_after]}, {required: [on_foot_only]}]}
            then: {required: [distance_miles]}
          - if: {properties: {pause_after: {const: true}}, required: [pause_after]}
            then: {required: [checkpoint]}
        oneOf: [{required: [minutes]}, {required: [days]}, {required: [distance_miles]}]
        properties:
          at: {type: string, pattern: '^loc-'}
          minutes: {type: integer, minimum: 1}
          distance_miles: {type: number, exclusiveMinimum: 0}
          road: {enum: [好, 差, 很差]}
          cart_allowed: {type: boolean}
          checkpoint: {type: string, pattern: '^loc-'}
          pause_after: {type: boolean}
          on_foot_only: {type: boolean}
          days:
            type: array
            minItems: 2
            maxItems: 2
            items: {type: integer, minimum: 1, maximum: 365}
